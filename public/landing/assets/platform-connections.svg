<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" fill="none">
  <style>
    .signal-wave { fill: #b81724; opacity: .12; transform-origin: 350px 270px; animation: signal-rise 3s ease-out infinite; }
    .signal-wave.middle { animation-delay: .45s; }
    .signal-wave.outer { animation-delay: .9s; }
    @keyframes signal-rise {
      0%, 65%, 100% { opacity: .12; transform: scale(.98); }
      18%, 32% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) { .signal-wave { animation: none; opacity: .85; transform: none; } }
  </style>
